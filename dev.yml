services:
  elasticsearch:
    environment:
      - discovery.type=single-node
    networks:
      - default
      - search
    ports:
      - "127.0.0.1:9200:9200"
  vite:
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/code
      - /code/node_modules
    environment:
      NODE_ENV: "development"
  server:
    build:
      args:
        UBUNTU_MIRROR: "${UBUNTU_MIRROR}"
    image: comses/server:dev
    volumes:
      - ./django:/code
      - ./docs:/docs
    environment:
      DJANGO_SETTINGS_MODULE: "core.settings.dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    image: comses/server:dev
    volumes:
      - ./django:/code
      - ./docs:/docs
    environment:
      DJANGO_SETTINGS_MODULE: "core.settings.dev"
    depends_on:
      server:
        condition: service_healthy
  scheduler:
    image: comses/server:dev
    volumes:
      - ./django:/code
    environment:
      DJANGO_SETTINGS_MODULE: "core.settings.dev"
    depends_on:
      server:
        condition: service_healthy
